<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08090f" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>VSXSuite — Audio in motion</title>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <header>
      <a class="brand" href="#">VSX<span>SUITE</span></a>
      <div class="view-actions">
        <button id="focus" aria-pressed="false">Hide controls</button>
        <button id="fullscreen">Fullscreen</button>
        <button id="export" disabled>Export video</button>
        <a id="download-video" hidden>Download video</a>
      </div>
    </header>
    <aside id="rack" aria-label="Visual settings"></aside>
    <footer>
      <div class="transport">
        <button id="play" aria-label="Play">▶ &nbsp; PLAY</button
        ><button id="file">↗ &nbsp; OPEN AUDIO</button
        ><input
          id="file-input"
          type="file"
          accept="audio/*,.flac"
          hidden
        /><span id="source-label">DEMO BEAT · PRESS PLAY</span>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span>
        <input
          id="seek"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0"
          aria-label="Song position"
          disabled
        />
        <span id="duration">0:00</span>
      </div>
      <div class="stats">
        <span id="status">READY TO EXPLORE</span><span id="fps">— FPS</span>
        <span id="resolution" title="Internal render resolution"></span>
        <div class="meter"><i id="meter"></i></div>
      </div>
    </footer>
    <div id="drop">
      <span>DROP YOUR SOUND</span><small>MP3 · WAV · OGG · FLAC</small>
    </div>
    <div id="error" role="alert" hidden></div>
    <div id="export-status" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
